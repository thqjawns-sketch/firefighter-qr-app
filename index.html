<body>

<script>


const API =
"https://script.google.com/macros/s/AKfycbxTKCw24jpy-A2Z262fE005EXYBPohAWpjaw9NDcGE2RJhO6UGNs-LZrMzZTAVnE8zu/exec";


let members = [];
let currentMember = null;
let scanner = null;
let scanning = false;
let selectAllState = false;


const CHOSUNG = [
"ㄱ","ㄲ","ㄴ","ㄷ","ㄸ",
"ㄹ","ㅁ","ㅂ","ㅃ","ㅅ",
"ㅆ","ㅇ","ㅈ","ㅉ","ㅊ",
"ㅋ","ㅌ","ㅍ","ㅎ"
];



window.onload = function(){

  loadSites();
  loadMembers();

};



// ==========================================
// 현장
// ==========================================

async function loadSites(){

  try{

    const response =
      await fetch(API+"?action=sites");

    const data =
      await response.json();

    if(!data.success) return;


    const select =
      document.getElementById("site");


    data.sites.forEach(function(site){

      const option =
        document.createElement("option");

      option.value =
        site.siteName;

      option.textContent =
        site.siteName;

      select.appendChild(option);

    });

  }

  catch(error){

    console.error(error);

  }

}



// ==========================================
// 대원
// ==========================================

async function loadMembers(){

  try{

    const response =
      await fetch(API+"?action=members");

    const data =
      await response.json();

    if(!data.success) return;

    members=data.members;

  }

  catch(error){

    console.error(error);

  }

}



function getChosung(text){

  let result="";

  for(const char of text){

    const code =
      char.charCodeAt(0);

    if(
      code>=0xAC00 &&
      code<=0xD7A3
    ){

      const index =
        Math.floor(
          (code-0xAC00)/588
        );

      result +=
        CHOSUNG[index];

    }

    else{

      result+=char;

    }

  }

  return result;

}



function filterMembers(){

  const input =
    document
      .getElementById("memberSearch")
      .value
      .trim()
      .toLowerCase();


  const select =
    document
      .getElementById("member");


  select.innerHTML =
    '<option value="">검색 결과에서 대원을 선택하세요</option>';


  if(input===""){

    currentMember=null;
    return;

  }


  const filtered =
    members.filter(function(member){

      const name =
        String(member.name||"")
          .toLowerCase();

      const chosung =
        getChosung(
          String(member.name||"")
        );

      const id =
        String(member.id||"")
          .toLowerCase();

      const dept =
        String(member.dept||"")
          .toLowerCase();

      const rank =
        String(member.rank||"")
          .toLowerCase();


      return(

        name.includes(input) ||

        chosung.includes(input) ||

        id.includes(input) ||

        dept.includes(input) ||

        rank.includes(input)

      );

    });


  filtered.forEach(function(member){

    const option =
      document.createElement("option");

    option.value =
      member.id;

    option.textContent =
      member.name+
      " "+
      member.rank+
      " ("+
      member.id+
      ") / "+
      member.dept;

    select.appendChild(option);

  });


  if(filtered.length===1){

    select.value =
      filtered[0].id;

    currentMember =
      filtered[0];

    showMember(
      filtered[0]
    );

  }

}



function manualMemberSelect(){

  const id =
    document
      .getElementById("member")
      .value;

  if(!id){

    currentMember=null;
    return;

  }

  currentMember =
    members.find(
      m=>m.id===id
    );

  showMember(
    currentMember
  );

}



function showMember(member){

  document
    .getElementById("memberInfo")
    .innerHTML =

    "✅ 대원 확인 완료<br>"+

    "<span class='memberName'>"+
    member.name+
    " "+
    member.rank+
    "</span><br>"+

    member.id+
    "<br>"+

    member.dept;

}



// ==========================================
// QR
// ==========================================

async function startScanner(){

  if(scanning) return;


  try{

    scanner =
      new Html5Qrcode(
        "reader"
      );


    const cameras =
      await Html5Qrcode
        .getCameras();


    if(!cameras.length){

      alert(
        "카메라를 찾을 수 없습니다."
      );

      return;

    }


    const cameraId =
      cameras[
        cameras.length-1
      ].id;


    scanning=true;


    await scanner.start(

      cameraId,

      {
        fps:10,

        qrbox:{
          width:250,
          height:250
        }
      },


      async function(decodedText){

        const id =
          decodedText.trim();


        await scanner.stop();

        scanning=false;


        document
          .getElementById("reader")
          .innerHTML="";


        findMemberByQR(id);

      },


      function(){}

    );

  }

  catch(error){

    scanning=false;

    alert(
      "카메라 실행 오류"
    );

  }

}



function findMemberByQR(id){

  const member =
    members.find(
      m=>
        String(m.id).trim()===
        String(id).trim()
    );


  if(!member){

    currentMember=null;

    alert(
      "등록되지 않은 대원 QR입니다."
    );

    return;

  }


  currentMember=member;


  document
    .getElementById("memberSearch")
    .value =
    member.name;


  filterMembers();


  document
    .getElementById("member")
    .value =
    member.id;


  showMember(member);

}



// ==========================================
// PPE
// ==========================================

function checkPPE(){

  const complete =

    document
      .getElementById("ppe1")
      .checked &&

    document
      .getElementById("ppe2")
      .checked &&

    document
      .getElementById("ppe3")
      .checked;


  const status =
    document
      .getElementById("ppeStatus");


  if(complete){

    status.innerHTML =
      "✅ PPE 점검완료 · 투입 가능";

    status.style.background =
      "#e6f4ea";

    status.style.color =
      "#188038";

  }

  else{

    status.innerHTML =
      "⚠️ PPE 점검 미완료 · 투입 보류";

    status.style.background =
      "#fce8e6";

    status.style.color =
      "#d93025";

  }

}



// ==========================================
// 진입
// ==========================================

async function entryMember(){

  const site =
    document
      .getElementById("site")
      .value;


  const officer =
    document
      .getElementById("officer")
      .value
      .trim();


  if(!site){

    alert(
      "화재현장을 선택하세요."
    );

    return;

  }


  if(!officer){

    alert(
      "안전점검관 성명을 입력하세요."
    );

    return;

  }


  if(!currentMember){

    alert(
      "대원을 선택하세요."
    );

    return;

  }


  const ppeOK =

    document
      .getElementById("ppe1")
      .checked &&

    document
      .getElementById("ppe2")
      .checked &&

    document
      .getElementById("ppe3")
      .checked;


  if(!ppeOK){

    alert(
      "PPE 3개 항목을 모두 확인하세요."
    );

    return;

  }


  const form =
    new URLSearchParams();


  form.append(
    "action",
    "entry"
  );

  form.append(
    "site",
    site
  );

  form.append(
    "memberId",
    currentMember.id
  );

  form.append(
    "memberName",
    currentMember.name
  );

  form.append(
    "officer",
    officer
  );


  try{

    const response =
      await fetch(
        API,
        {
          method:"POST",
          body:form
        }
      );


    const data =
      await response.json();


    alert(
      data.message
    );


    if(data.success){

      resetNextMember();

      await loadInsideMembers();

    }

  }

  catch(error){

    alert(
      "진입 기록 오류"
    );

  }

}



// ==========================================
// 1명 철수
// ==========================================

async function exitOneMember(
  site,
  id,
  name
){

  const form =
    new URLSearchParams();


  form.append(
    "action",
    "exit"
  );

  form.append(
    "site",
    site
  );

  form.append(
    "memberId",
    id
  );

  form.append(
    "memberName",
    name
  );

  form.append(
    "officer",
    document
      .getElementById("officer")
      .value
      .trim()
  );


  try{

    const response =
      await fetch(
        API,
        {
          method:"POST",
          body:form
        }
      );


    return await response.json();

  }

  catch(error){

    return{
      success:false,
      message:
        name+" 철수 처리 오류"
    };

  }

}



async function exitMember(){

  const site =
    document
      .getElementById("site")
      .value;


  if(!site){

    alert(
      "화재현장을 선택하세요."
    );

    return;

  }


  if(!currentMember){

    alert(
      "철수할 대원을 선택하세요."
    );

    return;

  }


  const result =
    await exitOneMember(
      site,
      currentMember.id,
      currentMember.name
    );


  alert(
    result.message
  );


  if(result.success){

    resetNextMember();

    await loadInsideMembers();

  }

}



// ==========================================
// 내부대원
// ==========================================

async function loadInsideMembers(){

  const site =
    document
      .getElementById("site")
      .value;


  const list =
    document
      .getElementById("insideList");


  list.innerHTML="";


  if(!site){

    document
      .getElementById("insideCount")
      .innerHTML =
      "🔴 현재 현장 내부 0명";

    updateSelectedCount();

    return;

  }


  try{

    const response =
      await fetch(

        API+
        "?action=inside&site="+
        encodeURIComponent(site)

      );


    const data =
      await response.json();


    if(!data.success) return;


    document
      .getElementById("insideCount")
      .innerHTML =

      "🔴 현재 현장 내부 "+
      data.members.length+
      "명";


    data.members.forEach(
      function(member){

        const row =
          document
            .createElement("div");


        row.className =
          "memberRow";


        let warning="";


        if(
          member.currentMinutes>=30
        ){

          warning =

            "<div class='warning'>"+
            "⚠️ 현재 체류 30분 이상"+
            "</div>";

        }


        row.innerHTML =

          "<input "+
          "type='checkbox' "+
          "class='insideCheck' "+

          "data-id='"+
          member.memberId+
          "' "+

          "data-name='"+
          member.memberName+
          "' "+

          "onchange='updateSelectedCount()'>"+


          "<div class='memberDetail'>"+

          "<b>"+
          member.memberName+
          "</b> "+

          "("+
          member.memberId+
          ")"+

          "<div class='time'>"+

          "진입 "+
          member.entryTime+

          " / 현재 "+
          member.currentMinutes+
          "분"+

          " / "+
          member.entryCount+
          "회차"+

          "</div>"+

          warning+

          "</div>";


        list.appendChild(row);

      }
    );


    selectAllState=false;

    updateSelectedCount();

  }

  catch(error){

    console.error(error);

  }

}



// ==========================================
// 일괄 철수
// ==========================================

function toggleSelectAll(){

  const boxes =
    document.querySelectorAll(
      ".insideCheck"
    );


  selectAllState =
    !selectAllState;


  boxes.forEach(
    box=>
      box.checked=
        selectAllState
  );


  updateSelectedCount();

}



function updateSelectedCount(){

  const count =
    document.querySelectorAll(
      ".insideCheck:checked"
    ).length;


  document
    .getElementById(
      "selectedCount"
    )
    .innerHTML =

    "선택 대원 "+
    count+
    "명";

}



async function batchExitMembers(){

  const site =
    document
      .getElementById("site")
      .value;


  const officer =
    document
      .getElementById("officer")
      .value
      .trim();


  if(!site){

    alert(
      "화재현장을 선택하세요."
    );

    return;

  }


  if(!officer){

    alert(
      "안전점검관 성명을 입력하세요."
    );

    return;

  }


  const checked =
    document.querySelectorAll(
      ".insideCheck:checked"
    );


  if(
    checked.length===0
  ){

    alert(
      "철수 대원을 선택하세요."
    );

    return;

  }


  if(
    !confirm(
      checked.length+
      "명을 철수 처리하시겠습니까?"
    )
  ){

    return;

  }


  let successCount=0;


  for(
    const box of checked
  ){

    const result =
      await exitOneMember(

        site,

        box.dataset.id,

        box.dataset.name

      );


    if(
      result.success
    ){

      successCount++;

    }

  }


  alert(
    "✅ "+
    successCount+
    "명 철수 처리 완료"
  );


  await loadInsideMembers();

}

// ==========================================
// 지휘관 현황 열기
// ==========================================

function openDashboard(){

  const site =
    document
      .getElementById("site")
      .value;


  if(!site){

    alert(
      "먼저 화재현장을 선택하세요."
    );

    return;

  }


  document
    .getElementById("mainPage")
    .style.display="none";


  document
    .getElementById(
      "dashboardPage"
    )
    .style.display="block";


  window.scrollTo(
    0,
    0
  );


  loadDashboard();

}



function closeDashboard(){

  document
    .getElementById(
      "dashboardPage"
    )
    .style.display="none";


  document
    .getElementById(
      "mainPage"
    )
    .style.display="block";


  loadInsideMembers();


  window.scrollTo(
    0,
    0
  );

}



// ==========================================
// 지휘관 현황 불러오기
// ==========================================

async function loadDashboard(){

  const site =
    document
      .getElementById("site")
      .value;


  if(!site) return;


  document
    .getElementById(
      "dashboardSiteName"
    )
    .innerText =
    site;


  try{

    const response =
      await fetch(

        API+
        "?action=dashboard&site="+
        encodeURIComponent(site)

      );


    const data =
      await response.json();


    if(
      !data.success
    ){

      alert(
        "현장 현황을 불러오지 못했습니다."
      );

      return;

    }


    const dash =
      data.dashboard;


    document
      .getElementById(
        "dashInside"
      )
      .innerText =
      dash.insideCount;


    document
      .getElementById(
        "dashUnique"
      )
      .innerText =
      dash.uniqueMemberCount;


    document
      .getElementById(
        "dashExited"
      )
      .innerText =
      dash.exitedCount;


    document
      .getElementById(
        "dashEntries"
      )
      .innerText =
      dash.totalEntryCount;


    drawDashboardInside(
      dash.insideMembers
    );


    drawDashboardExited(
      dash.exitedMembers
    );

  }

  catch(error){

    console.error(error);

    alert(
      "현장 현황 통신 오류"
    );

  }

}



// ==========================================
// 지휘관 - 현재 내부
// ==========================================

function drawDashboardInside(
  insideMembers
){

  const area =
    document
      .getElementById(
        "dashboardInside"
      );


  area.innerHTML="";


  if(
    insideMembers.length===0
  ){

    area.innerHTML =
      "<div class='empty'>"+
      "현재 내부 대원이 없습니다."+
      "</div>";

    return;

  }


  insideMembers.forEach(
    function(member){

      const div =
        document
          .createElement("div");


      div.className =
        "commandMember inside";


      let warning="";


      if(
        member.currentMinutes>=30
      ){

        warning =

          "<div class='alert30'>"+
          "⚠️ 현재 체류 30분 이상"+
          "</div>";

      }


      const historyId =
        "history_"+
        member.memberId+
        "_inside";


      div.innerHTML =

        "<div class='commandName'>"+
        "🔴 "+
        member.memberName+
        " ("+
        member.memberId+
        ")"+
        "</div>"+


        "<div class='commandInfo'>"+

        "현재 상태 : <b>현장 내부</b><br>"+

        "현재 체류 : <b>"+
        member.currentMinutes+
        "분</b><br>"+

        "진입 횟수 : "+
        member.entryCount+
        "회<br>"+

        "이전 활동 : "+
        member.completedMinutes+
        "분<br>"+

        "누적 활동 : <b>"+
        member.totalMinutes+
        "분</b>"+

        "</div>"+

        warning+

        "<button "+
        "class='detailBtn' "+
        "onclick=\"toggleHistory('"+
        historyId+
        "')\">"+

        "📋 진입·철수 이력 보기"+

        "</button>"+

        "<div "+
        "id='"+
        historyId+
        "' "+
        "class='history'>"+

        makeHistoryHTML(
          member.records
        )+

        "</div>";


      area.appendChild(
        div
      );

    }
  );

}



// ==========================================
// 지휘관 - 철수 대원
// ==========================================

function drawDashboardExited(
  exitedMembers
){

  const area =
    document
      .getElementById(
        "dashboardExited"
      );


  area.innerHTML="";


  if(
    exitedMembers.length===0
  ){

    area.innerHTML =
      "<div class='empty'>"+
      "철수 완료 대원이 없습니다."+
      "</div>";

    return;

  }


  exitedMembers.forEach(
    function(member){

      const div =
        document
          .createElement("div");


      div.className =
        "commandMember exited";


      const historyId =
        "history_"+
        member.memberId+
        "_exit";


      div.innerHTML =

        "<div class='commandName'>"+
        "🟢 "+
        member.memberName+
        " ("+
        member.memberId+
        ")"+
        "</div>"+


        "<div class='commandInfo'>"+

        "현재 상태 : <b>철수</b><br>"+

        "총 진입 : "+
        member.entryCount+
        "회<br>"+

        "누적 활동 : <b>"+
        member.totalMinutes+
        "분</b>"+

        "</div>"+


        "<button "+
        "class='detailBtn' "+
        "onclick=\"toggleHistory('"+
        historyId+
        "')\">"+

        "📋 전체 활동이력 보기"+

        "</button>"+


        "<div "+
        "id='"+
        historyId+
        "' "+
        "class='history'>"+

        makeHistoryHTML(
          member.records
        )+

        "</div>";


      area.appendChild(
        div
      );

    }
  );

}



// ==========================================
// 활동 이력
// ==========================================

function makeHistoryHTML(
  records
){

  let html="";


  records.forEach(
    function(record){

      let state =
        record.status ===
        "진입중"
        ? "🔴 현재 내부"
        : "🟢 철수완료";


      html +=

        "<div class='historyRow'>"+

        "<b>"+
        record.sequence+
        "차 진입</b><br>"+

        record.entryTime+
        " → "+
        record.exitTime+
        "<br>"+

        "활동 "+
        record.minutes+
        "분 / "+
        state+

        "</div>";

    }
  );


  return html;

}



function toggleHistory(id){

  const box =
    document
      .getElementById(id);


  if(
    box.style.display===
    "block"
  ){

    box.style.display=
      "none";

  }

  else{

    box.style.display=
      "block";

  }

}
