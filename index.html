<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>소방대원 현장안전관리</title>

<script src="https://unpkg.com/html5-qrcode"
type="text/javascript"></script>

<style>

body {
  margin: 0;
  padding: 14px;
  background: #f4f6f8;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 560px;
  margin: auto;
}

.title {
  background: #17365d;
  color: white;
  padding: 18px;
  border-radius: 12px;
  text-align: center;
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 14px;
}

.card {
  background: white;
  padding: 16px;
  border-radius: 12px;
  margin-bottom: 14px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

label {
  display: block;
  font-weight: bold;
  margin-top: 12px;
  margin-bottom: 6px;
}

select,
input[type="text"] {
  width: 100%;
  box-sizing: border-box;
  padding: 13px;
  font-size: 16px;
  border: 1px solid #ccc;
  border-radius: 8px;
}

button {
  width: 100%;
  padding: 15px;
  border: 0;
  border-radius: 10px;
  font-size: 17px;
  font-weight: bold;
  margin-top: 10px;
  cursor: pointer;
}

.scan {
  background: #17365d;
  color: white;
}

.entry {
  background: #d93025;
  color: white;
}

.exit {
  background: #188038;
  color: white;
}

.refresh {
  background: #44546a;
  color: white;
}

#reader {
  width: 100%;
  margin-top: 12px;
}

.memberInfo {
  margin-top: 12px;
  padding: 14px;
  background: #e8f0fe;
  border-radius: 10px;
  text-align: center;
  line-height: 1.6;
}

.memberName {
  font-size: 21px;
  font-weight: bold;
}

.ppeBox {
  padding: 14px;
  margin-top: 10px;
  background: #f5f7fa;
  border-radius: 10px;
}

.ppeBox label {
  margin: 0;
  font-size: 16px;
}

.ppeBox input {
  transform: scale(1.3);
  margin-right: 8px;
}

.small {
  font-size: 13px;
  color: #666;
  margin-left: 28px;
  margin-top: 5px;
}

.status {
  padding: 14px;
  margin-top: 14px;
  text-align: center;
  font-weight: bold;
  border-radius: 10px;
  background: #eee;
}

.insideTitle {
  font-size: 20px;
  font-weight: bold;
}

.memberRow {
  padding: 12px 4px;
  border-bottom: 1px solid #ddd;
}

.time {
  margin-top: 4px;
  font-size: 14px;
  color: #555;
}

.warning {
  color: #d93025;
  font-weight: bold;
}

.searchInfo {
  margin-top: 8px;
  font-size: 13px;
  color: #666;
}

</style>
</head>


<body>

<div class="container">

<div class="title">
🚒 소방대원 현장안전관리
</div>


<div class="card">

<label>화재현장</label>

<select id="site"
onchange="loadInsideMembers()">

<option value="">
현장을 선택하세요
</option>

</select>


<label>안전점검관</label>

<input type="text"
id="officer"
placeholder="안전점검관 성명">

</div>


<div class="card">

<h3>👨‍🚒 대원 확인</h3>

<button class="scan"
onclick="startScanner()">

📷 대원 QR 스캔

</button>

<div id="reader"></div>


<div id="memberInfo"
class="memberInfo">

QR을 스캔하거나<br>
이름·초성으로 대원을 검색하세요.

</div>


<label>이름 / 초성 / 관리번호 검색</label>

<input
type="text"
id="memberSearch"
placeholder="예: 김도윤 / ㄱㄷㅇ / FW-013"
oninput="filterMembers()">


<div class="searchInfo">
검색어를 입력하면 일치하는 대원만 표시됩니다.
</div>


<label>검색 결과</label>

<select id="member"
onchange="manualMemberSelect()">

<option value="">
검색 결과에서 대원을 선택하세요
</option>

</select>

</div>


<div class="card">

<h3>🦺 PPE 안전점검</h3>


<div class="ppeBox">

<label>

<input type="checkbox"
id="ppe1"
onchange="checkPPE()">

개인보호장비 정상

</label>

<div class="small">
방화복 · 헬멧 · 두건 · 장갑 · 안전화
</div>

</div>


<div class="ppeBox">

<label>

<input type="checkbox"
id="ppe2"
onchange="checkPPE()">

공기호흡기 정상

</label>

<div class="small">
공기호흡기 · 면체 정상상태 확인
</div>

</div>


<div class="ppeBox">

<label>

<input type="checkbox"
id="ppe3"
onchange="checkPPE()">

안전·통신장비 정상

</label>

<div class="small">
PASS · 무전기 정상상태 확인
</div>

</div>


<div id="ppeStatus"
class="status">

PPE 점검 대기

</div>

</div>


<div class="card">

<button class="entry"
onclick="entryMember()">

🔴 진입 승인

</button>


<button class="exit"
onclick="exitMember()">

🟢 철수 처리

</button>

</div>


<div class="card">

<div id="insideCount"
class="insideTitle">

🔴 현재 현장 내부 0명

</div>


<button class="refresh"
onclick="loadInsideMembers()">

🔄 현황 새로고침

</button>


<div id="insideList"></div>

</div>

</div>


<script>

// =============================================
// Apps Script API 주소
// =============================================

const API =
"https://script.google.com/macros/s/AKfycbxTKCw24jpy-A2Z262fE005EXYBPohAWpjaw9NDcGE2RJhO6UGNs-LZrMzZTAVnE8zu/exec";


let members = [];
let currentMember = null;
let scanner = null;
let scanning = false;


// =============================================
// 한글 초성
// =============================================

const CHOSUNG = [
  "ㄱ","ㄲ","ㄴ","ㄷ","ㄸ",
  "ㄹ","ㅁ","ㅂ","ㅃ","ㅅ",
  "ㅆ","ㅇ","ㅈ","ㅉ","ㅊ",
  "ㅋ","ㅌ","ㅍ","ㅎ"
];


// =============================================
// 시작
// =============================================

window.onload = function() {

  loadSites();
  loadMembers();

};


// =============================================
// 현장목록
// =============================================

async function loadSites() {

  try {

    const response =
      await fetch(API + "?action=sites");

    const data =
      await response.json();

    if (!data.success) return;


    const select =
      document.getElementById("site");


    data.sites.forEach(function(site) {

      const option =
        document.createElement("option");

      option.value =
        site.siteName;

      option.textContent =
        site.siteName;

      select.appendChild(option);

    });

  }

  catch (error) {

    console.error(error);

  }

}


// =============================================
// 대원명단 불러오기
// =============================================

async function loadMembers() {

  try {

    const response =
      await fetch(API + "?action=members");

    const data =
      await response.json();


    if (!data.success) return;


    members =
      data.members;

  }

  catch (error) {

    console.error(error);

  }

}


// =============================================
// 초성 추출
// =============================================

function getChosung(text) {

  let result = "";


  for (const char of text) {

    const code =
      char.charCodeAt(0);


    if (
      code >= 0xAC00 &&
      code <= 0xD7A3
    ) {

      const index =
        Math.floor(
          (code - 0xAC00) / 588
        );

      result +=
        CHOSUNG[index];

    }

    else {

      result += char;

    }

  }


  return result;

}


// =============================================
// 대원 검색
// =============================================

function filterMembers() {

  const input =
    document
      .getElementById("memberSearch")
      .value
      .trim()
      .toLowerCase();


  const select =
    document
      .getElementById("member");


  select.innerHTML =
    '<option value="">' +
    '검색 결과에서 대원을 선택하세요' +
    '</option>';


  if (input === "") {

    currentMember = null;

    return;

  }


  const filtered =
    members.filter(function(member) {

      const name =
        String(member.name || "")
          .toLowerCase();

      const chosung =
        getChosung(
          String(member.name || "")
        );

      const id =
        String(member.id || "")
          .toLowerCase();

      const dept =
        String(member.dept || "")
          .toLowerCase();

      const rank =
        String(member.rank || "")
          .toLowerCase();


      return (

        name.includes(input) ||

        chosung.includes(input) ||

        id.includes(input) ||

        dept.includes(input) ||

        rank.includes(input)

      );

    });


  filtered.forEach(
    function(member) {

      const option =
        document.createElement("option");


      option.value =
        member.id;


      option.textContent =

        member.name +
        " " +
        member.rank +
        " (" +
        member.id +
        ") / " +
        member.dept;


      select.appendChild(option);

    }
  );


  if (filtered.length === 1) {

    select.value =
      filtered[0].id;

    currentMember =
      filtered[0];

    showMember(
      filtered[0]
    );

  }

}


// =============================================
// QR 카메라
// =============================================

async function startScanner() {

  if (scanning) return;


  const info =
    document.getElementById("memberInfo");


  info.innerHTML =
    "📷 카메라를 준비하고 있습니다...";


  try {

    scanner =
      new Html5Qrcode("reader");


    const cameras =
      await Html5Qrcode.getCameras();


    if (!cameras.length) {

      alert("카메라를 찾을 수 없습니다.");

      return;

    }


    let cameraId =
      cameras[cameras.length - 1].id;


    scanning = true;


    await scanner.start(

      cameraId,

      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        }
      },


      async function(decodedText) {

        const id =
          decodedText.trim();


        await scanner.stop();

        scanning = false;


        document
          .getElementById("reader")
          .innerHTML = "";


        findMemberByQR(id);

      },


      function() {

      }

    );

  }

  catch (error) {

    scanning = false;

    alert(
      "카메라 실행 오류\n" +
      error
    );

  }

}


// =============================================
// QR 대원 찾기
// =============================================

function findMemberByQR(id) {

  const member =
    members.find(function(m) {

      return String(m.id).trim() ===
             String(id).trim();

    });


  if (!member) {

    currentMember = null;

    document
      .getElementById("memberInfo")
      .innerHTML =

      "⚠️ 등록되지 않은 QR입니다.<br>" +
      id;


    alert(
      "등록되지 않은 대원 QR입니다."
    );

    return;

  }


  currentMember =
    member;


  document
    .getElementById("memberSearch")
    .value =
    member.name;


  filterMembers();


  document
    .getElementById("member")
    .value =
    member.id;


  showMember(member);

}


// =============================================
// 직접 대원 선택
// =============================================

function manualMemberSelect() {

  const id =
    document
      .getElementById("member")
      .value;


  if (!id) {

    currentMember = null;

    return;

  }


  const member =
    members.find(function(m) {

      return m.id === id;

    });


  currentMember =
    member;


  showMember(member);

}


// =============================================
// 대원 표시
// =============================================

function showMember(member) {

  document
    .getElementById("memberInfo")
    .innerHTML =

    "✅ 대원 확인 완료<br>" +

    "<span class='memberName'>" +
    member.name +
    " " +
    member.rank +
    "</span><br>" +

    member.id +
    "<br>" +

    member.dept;

}


// =============================================
// PPE
// =============================================

function checkPPE() {

  const complete =

    document.getElementById("ppe1").checked &&

    document.getElementById("ppe2").checked &&

    document.getElementById("ppe3").checked;


  const status =
    document.getElementById("ppeStatus");


  if (complete) {

    status.innerHTML =
      "✅ PPE 점검완료 · 투입 가능";

    status.style.background =
      "#e6f4ea";

    status.style.color =
      "#188038";

  }

  else {

    status.innerHTML =
      "⚠️ PPE 점검 미완료 · 투입 보류";

    status.style.background =
      "#fce8e6";

    status.style.color =
      "#d93025";

  }

}


// =============================================
// 진입
// =============================================

async function entryMember() {

  const site =
    document.getElementById("site").value;


  const officer =
    document
      .getElementById("officer")
      .value
      .trim();


  if (!site) {

    alert("화재현장을 선택하세요.");

    return;

  }


  if (!officer) {

    alert("안전점검관 성명을 입력하세요.");

    return;

  }


  if (!currentMember) {

    alert(
      "대원 QR을 스캔하거나 이름으로 검색하세요."
    );

    return;

  }


  const ppeOK =

    document.getElementById("ppe1").checked &&

    document.getElementById("ppe2").checked &&

    document.getElementById("ppe3").checked;


  if (!ppeOK) {

    alert(
      "PPE 3개 항목을 모두 확인해야 합니다."
    );

    return;

  }


  const form =
    new URLSearchParams();


  form.append(
    "action",
    "entry"
  );


  form.append(
    "site",
    site
  );


  form.append(
    "memberId",
    currentMember.id
  );


  form.append(
    "memberName",
    currentMember.name
  );


  form.append(
    "officer",
    officer
  );


  try {

    const response =
      await fetch(
        API,
        {
          method: "POST",
          body: form
        }
      );


    const data =
      await response.json();


    alert(data.message);


    if (data.success) {

      await loadInsideMembers();

      resetNextMember();

    }

  }

  catch (error) {

    alert(
      "진입 기록 중 오류가 발생했습니다."
    );

    console.error(error);

  }

}


// =============================================
// 철수
// =============================================

async function exitMember() {

  const site =
    document.getElementById("site").value;


  if (!site) {

    alert("화재현장을 선택하세요.");

    return;

  }


  if (!currentMember) {

    alert(
      "철수할 대원을 QR 또는 검색으로 선택하세요."
    );

    return;

  }


  const form =
    new URLSearchParams();


  form.append(
    "action",
    "exit"
  );


  form.append(
    "site",
    site
  );


  form.append(
    "memberId",
    currentMember.id
  );


  form.append(
    "memberName",
    currentMember.name
  );


  form.append(
    "officer",
    document
      .getElementById("officer")
      .value
      .trim()
  );


  try {

    const response =
      await fetch(
        API,
        {
          method: "POST",
          body: form
        }
      );


    const data =
      await response.json();


    alert(data.message);


    if (data.success) {

      await loadInsideMembers();

      resetNextMember();

    }

  }

  catch (error) {

    alert(
      "철수 기록 중 오류가 발생했습니다."
    );

    console.error(error);

  }

}


// =============================================
// 다음 대원 준비
// =============================================

function resetNextMember() {

  currentMember = null;


  document
    .getElementById("memberSearch")
    .value = "";


  document
    .getElementById("member")
    .innerHTML =

    '<option value="">' +
    '검색 결과에서 대원을 선택하세요' +
    '</option>';


  document
    .getElementById("ppe1")
    .checked = false;


  document
    .getElementById("ppe2")
    .checked = false;


  document
    .getElementById("ppe3")
    .checked = false;


  document
    .getElementById("memberInfo")
    .innerHTML =

    "📷 다음 대원의 QR을 스캔하거나<br>" +
    "이름·초성으로 검색하세요.";


  const status =
    document.getElementById("ppeStatus");


  status.innerHTML =
    "PPE 점검 대기";


  status.style.background =
    "#eeeeee";


  status.style.color =
    "#333333";

}


// =============================================
// 현재 내부대원
// =============================================

async function loadInsideMembers() {

  const site =
    document.getElementById("site").value;


  if (!site) {

    document
      .getElementById("insideCount")
      .innerHTML =
      "🔴 현재 현장 내부 0명";


    document
      .getElementById("insideList")
      .innerHTML =
      "";

    return;

  }


  try {

    const response =
      await fetch(

        API +
        "?action=inside&site=" +
        encodeURIComponent(site)

      );


    const data =
      await response.json();


    if (!data.success) return;


    const list =
      document.getElementById("insideList");


    list.innerHTML = "";


    document
      .getElementById("insideCount")
      .innerHTML =

      "🔴 현재 현장 내부 " +
      data.members.length +
      "명";


    data.members.forEach(
      function(member) {

        const div =
          document.createElement("div");


        div.className =
          "memberRow";


        let warning =
          "";


        if (
          member.activityMinutes >= 30
        ) {

          warning =
            "<span class='warning'>" +
            "⚠️ 장시간 활동" +
            "</span>";

        }


        div.innerHTML =

          "<b>" +
          member.memberName +
          "</b>" +

          " (" +
          member.memberId +
          ")" +

          "<div class='time'>" +

          "진입 " +
          member.entryTime +

          " / 활동 " +
          member.activityMinutes +
          "분 " +

          warning +

          "</div>";


        list.appendChild(div);

      }
    );

  }

  catch (error) {

    console.error(error);

  }

}

</script>

</body>
</html>
